name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_mysql, intl, bcmath
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Known-vulnerability audit
        run: composer audit --no-interaction

      - name: Test suite (SQLite in-memory)
        run: php artisan test

  mysql-migration-rehearsal:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: erp_ci
          MYSQL_ROOT_PASSWORD: secret
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, intl, bcmath
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Fresh migrate + seed on real MySQL
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: erp_ci
          DB_USERNAME: root
          DB_PASSWORD: secret
          PLATFORM_ADMIN_PRIMARY_EMAIL: owner@example.test
          SESSION_DRIVER: array
          CACHE_STORE: array
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate:fresh --seed --force
